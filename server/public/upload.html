<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识库文件上传 v2.0</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 800px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
            font-weight: 300;
        }

        .upload-area {
            border: 3px dashed #ddd;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 30px;
        }

        .upload-area:hover {
            border-color: #667eea;
            background-color: #f8f9ff;
        }

        .upload-area.dragover {
            border-color: #667eea;
            background-color: #f0f2ff;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 4em;
            color: #667eea;
            margin-bottom: 20px;
        }

        .upload-text {
            color: #666;
            font-size: 1.2em;
            margin-bottom: 10px;
        }

        .upload-hint {
            color: #999;
            font-size: 0.9em;
        }

        #fileInput {
            display: none;
        }

        .text-input {
            margin-bottom: 30px;
        }

        .text-input label {
            display: block;
            margin-bottom: 10px;
            color: #333;
            font-weight: 500;
        }

        .text-input textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            resize: vertical;
            transition: border-color 0.3s ease;
        }

        .text-input textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-bottom: 20px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .progress {
            width: 100%;
            height: 6px;
            background-color: #f0f0f0;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 20px;
            display: none;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s ease;
        }

        .result {
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .result.success {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        .result.error {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        .file-info {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #666;
            font-size: 0.9em;
        }

        .links {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .links a {
            color: #667eea;
            text-decoration: none;
            padding: 10px 20px;
            border: 2px solid #667eea;
            border-radius: 25px;
            transition: all 0.3s ease;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .links a:hover {
            background-color: #667eea;
            color: white;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .container {
                padding: 20px;
                margin: 10px;
            }
            
            .links {
                flex-direction: column;
                gap: 10px;
            }
            
            .links a {
                width: 100%;
                text-align: center;
                max-width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 知识库文件上传</h1>
        
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📁</div>
            <div class="upload-text">点击或拖拽文件到此处</div>
            <div class="upload-hint">支持多种格式：TXT, MD, DOCX, PDF, XLSX, CSV, JSON, XML, HTML 等，最大 50MB</div>
            <input type="file" id="fileInput" accept=".txt,.md,.docx,.doc,.pdf,.xlsx,.xls,.csv,.json,.xml,.html,.htm">
        </div>

        <div class="text-input">
            <label for="textInput">或者直接输入文本：</label>
            <textarea id="textInput" placeholder="在这里输入要添加到知识库的文本内容..."></textarea>
        </div>

        <!-- 分块选项 -->
        <div class="chunk-options" style="margin-bottom: 30px;">
            <label style="display: block; margin-bottom: 10px; color: #333; font-weight: 500;">分块设置：</label>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div>
                    <label style="display: block; margin-bottom: 5px; color: #666; font-size: 0.9em;">块大小</label>
                    <input type="number" id="chunkSize" value="800" min="100" max="2000" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 5px;">
                </div>
                <div>
                    <label style="display: block; margin-bottom: 5px; color: #666; font-size: 0.9em;">重叠度</label>
                    <input type="number" id="overlap" value="100" min="0" max="500" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 5px;">
                </div>
            </div>
        </div>

        <div class="file-info" id="fileInfo">
            <strong>选中的文件：</strong> <span id="fileName"></span><br>
            <strong>文件大小：</strong> <span id="fileSize"></span>
        </div>

        <div class="progress" id="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <button class="btn" id="uploadBtn" onclick="uploadToKnowledge()">上传到知识库</button>

        <div class="result" id="result"></div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-number" id="totalFiles">-</div>
                <div class="stat-label">总文件数</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="totalDocs">-</div>
                <div class="stat-label">总文档块</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="totalSize">-</div>
                <div class="stat-label">总大小</div>
            </div>
        </div>

        <div class="links">
            <a href="/database.html">📊 查看数据库</a>
            <a href="/search.html">🔍 搜索知识库</a>
            <a href="#" onclick="showSupportedFormats()">📋 支持格式</a>
        </div>
    </div>

    <script>
        let selectedFile = null;

        // 拖拽功能
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');

        uploadArea.addEventListener('click', () => fileInput.click());
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            // 支持的文件格式
            const supportedFormats = ['.txt', '.md', '.docx', '.doc', '.pdf', '.xlsx', '.xls', '.csv', '.json', '.xml', '.html', '.htm'];
            const fileExtension = '.' + file.name.split('.').pop().toLowerCase();
            
            if (!supportedFormats.includes(fileExtension)) {
                showResult(`不支持的文件格式: ${fileExtension}。支持的格式: ${supportedFormats.join(', ')}`, 'error');
                return;
            }

            if (file.size > 50 * 1024 * 1024) { // 50MB限制
                showResult('文件太大，最大支持 50MB', 'error');
                return;
            }

            selectedFile = file;
            fileName.textContent = file.name;
            fileSize.textContent = formatFileSize(file.size);
            fileInfo.style.display = 'block';
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        async function uploadToKnowledge() {
            const textInput = document.getElementById('textInput');
            const uploadBtn = document.getElementById('uploadBtn');
            const progress = document.getElementById('progress');
            const progressBar = document.getElementById('progressBar');

            if (!selectedFile && !textInput.value.trim()) {
                showResult('请选择文件或输入文本', 'error');
                return;
            }

            uploadBtn.disabled = true;
            progress.style.display = 'block';
            progressBar.style.width = '0%';

            try {
                const formData = new FormData();
                
                // 获取分块选项
                const chunkSize = document.getElementById('chunkSize').value;
                const overlap = document.getElementById('overlap').value;
                const chunkOptions = {
                    chunkSize: parseInt(chunkSize),
                    overlap: parseInt(overlap),
                    preserveStructure: true
                };
                
                if (selectedFile) {
                    formData.append('file', selectedFile);
                    formData.append('chunkOptions', JSON.stringify(chunkOptions));
                } else {
                    formData.append('text', textInput.value);
                    formData.append('chunkOptions', JSON.stringify(chunkOptions));
                }

                // 模拟进度
                let progressValue = 0;
                const progressInterval = setInterval(() => {
                    progressValue += Math.random() * 20;
                    if (progressValue > 90) progressValue = 90;
                    progressBar.style.width = progressValue + '%';
                }, 200);

                const response = await fetch('/api/vector/upload', {
                    method: 'POST',
                    body: formData
                });

                clearInterval(progressInterval);
                progressBar.style.width = '100%';

                const result = await response.json();

                if (result.ok) {
                    let message = `上传成功！\n文件名：${result.filename}\n文件类型：${result.fileType}\n处理了 ${result.inserted}/${result.total} 个文档块`;
                    
                    if (result.metadata && Object.keys(result.metadata).length > 0) {
                        message += `\n文件信息：${JSON.stringify(result.metadata, null, 2)}`;
                    }
                    
                    showResult(message, 'success');
                    textInput.value = '';
                    selectedFile = null;
                    fileInfo.style.display = 'none';
                    fileInput.value = '';
                    loadStats();
                } else {
                    showResult('上传失败：' + result.error, 'error');
                }
            } catch (error) {
                showResult('上传出错：' + error.message, 'error');
            } finally {
                uploadBtn.disabled = false;
                setTimeout(() => {
                    progress.style.display = 'none';
                }, 1000);
            }
        }

        function showResult(message, type) {
            const result = document.getElementById('result');
            result.textContent = message;
            result.className = `result ${type}`;
            result.style.display = 'block';
            
            setTimeout(() => {
                result.style.display = 'none';
            }, 5000);
        }

        async function loadStats() {
            try {
                const response = await fetch('/api/vector/stats');
                const data = await response.json();
                
                if (data.stats) {
                    document.getElementById('totalFiles').textContent = data.stats.totalFiles;
                    document.getElementById('totalDocs').textContent = data.stats.totalDocuments;
                    document.getElementById('totalSize').textContent = formatFileSize(data.stats.totalSize);
                }
                
                // 显示支持的文件格式
                if (data.supportedFormats) {
                    console.log('支持的文件格式:', data.supportedFormats);
                }
            } catch (error) {
                console.error('Failed to load stats:', error);
            }
        }

        // 显示支持的文件格式
        function showSupportedFormats() {
            const formats = {
                '.txt': '纯文本文件',
                '.md': 'Markdown文档',
                '.docx': 'Microsoft Word文档',
                '.doc': 'Microsoft Word文档(旧版)',
                '.pdf': 'PDF文档',
                '.xlsx': 'Microsoft Excel表格',
                '.xls': 'Microsoft Excel表格(旧版)',
                '.csv': 'CSV数据文件',
                '.json': 'JSON数据文件',
                '.xml': 'XML文档',
                '.html': 'HTML网页',
                '.htm': 'HTML网页'
            };
            
            let message = '支持的文件格式：\n\n';
            Object.entries(formats).forEach(([ext, desc]) => {
                message += `${ext} - ${desc}\n`;
            });
            message += '\n最大文件大小：50MB';
            
            showResult(message, 'success');
        }

        // 页面加载时获取统计信息
        loadStats();
    </script>
</body>
</html>
